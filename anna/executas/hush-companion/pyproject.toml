[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-hush-companion"
version = "0.1.0"
description = "Executa for the hush-companion Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-hush-companion" = "hush_companion_plugin:main"

[tool.setuptools]
py-modules = ["hush_companion_plugin"]
