name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /hush-companion/

      - name: Verify generated Pages paths
        run: node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const html = readFileSync("dist/index.html", "utf8");
          const required = [
            "/hush-companion/assets/",
            "/hush-companion/favicon.svg",
          ];
          const forbidden = [
            "src=\"/src/main.tsx\"",
            "href=\"favicon.svg\"",
            "href=\"/favicon.svg\"",
          ];
          for (const value of required) {
            if (!html.includes(value)) throw new Error(`Missing generated path: ${value}`);
          }
          for (const value of forbidden) {
            if (html.includes(value)) throw new Error(`Forbidden source path: ${value}`);
          }
        '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
