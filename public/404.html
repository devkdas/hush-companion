<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages serves this file for client-side routes.
      // With a custom domain, base is '/' so no repo prefix needed.
      const requested = window.location.pathname;
      window.location.replace(`/?path=${encodeURIComponent(requested + window.location.search + window.location.hash)}`);
    </script>
  </head>
  <body></body>
</html>
